name: Rust & Python CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build CLI and Run E2E Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- RUST SETUP ---
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check Rust Formatting
      run: cargo fmt --all -- --check

    - name: Lint Rust Code
      run: cargo clippy -- -D warnings

    - name: Build Release Binary
      run: cargo build --release

    # --- PYTHON SETUP ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Add any other deps your sbpf_debugger.py needs (e.g., pydantic, etc.)
        if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi

    # --- RUN E2E TESTS ---
    - name: Run Python E2E Tests
      env:
        # Matches the env var in your _resolve_binary method
        SBPF_INTERPRETER_BIN: ${{ github.workspace }}/target/release/sbpf_interpreter_
      run: |
        pytest tests/test_sbpf_debugger.py -v --tb=short
