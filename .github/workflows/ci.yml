name: Rust & Python CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build CLI and Run E2E Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main project
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # --- FIX: Add --workspace to only check local code ---
    - name: Check Rust Formatting
      run: cargo fmt --all --workspace -- --check

    # --- FIX: Add --workspace to only lint local code ---
    - name: Lint Rust Code
      run: cargo clippy --workspace -- -D warnings

    - name: Build Release Binary
      run: cargo build --release

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Python E2E Tests
      env:
        SBPF_INTERPRETER_BIN: ${{ github.workspace }}/target/release/sbpf_interpreter_
      run: |
        pytest tests/test_sbpf_debugger.py -v --tb=short
