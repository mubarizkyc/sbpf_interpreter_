name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag like v1.0.0

jobs:
  release:
    name: Release - ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sbpf_interpreter_
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: sbpf_interpreter_
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sbpf_interpreter_.exe

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Prepare Binary
        shell: bash
        run: |
          mkdir -p release_artifacts
          cp target/${{ matrix.platform.target }}/release/sbpf_interpreter_* release_artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
